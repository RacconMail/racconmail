<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="stealth-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="visor-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="100" fill="url(#stealth-bg)" />
  <circle cx="100" cy="100" r="94" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 4" />
  <!-- Raccoon Ears -->
  <polygon points="55,80 40,30 85,55" fill="#334155" />
  <polygon points="60,75 50,42 80,58" fill="#06B6D4" opacity="0.4" />
  <polygon points="145,80 160,30 115,55" fill="#334155" />
  <polygon points="140,75 150,42 120,58" fill="#06B6D4" opacity="0.4" />
  <!-- Raccoon Face Outer -->
  <path d="M50,95 Q100,50 150,95 Q170,140 100,165 Q30,140 50,95 Z" fill="#1E293B" stroke="#475569" stroke-width="2" />
  <!-- Mask -->
  <path d="M52,95 Q100,82 148,95 Q135,130 100,122 Q65,130 52,95 Z" fill="#090D16" />
  <!-- Cyber Visor / Eyes -->
  <rect x="62" y="98" width="76" height="16" rx="8" fill="url(#visor-glow)" filter="drop-shadow(0 0 6px #06B6D4)" />
  <line x1="100" y1="98" x2="100" y2="114" stroke="#0F172A" stroke-width="2" />
  <!-- Nose & Snout -->
  <path d="M85,122 Q100,118 115,122 L100,148 Z" fill="#F8FAFC" />
  <polygon points="94,142 106,142 100,148" fill="#0F172A" />
  <!-- Cheeks markings -->
  <line x1="38" y1="120" x2="68" y2="126" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="36" y1="130" x2="66" y2="134" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="162" y1="120" x2="132" y2="126" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="164" y1="130" x2="134" y2="134" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>