<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F5FF"/>
      <stop offset="100%" stop-color="#D6E4FF"/>
    </linearGradient>
    <linearGradient id="blueBrush4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#597EF7"/>
      <stop offset="60%" stop-color="#2F54EB"/>
      <stop offset="100%" stop-color="#10239E"/>
    </linearGradient>
    <filter id="canvasTexture4">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>
  <g filter="url(#canvasTexture4)">
    <rect x="60" y="50" width="270" height="160" rx="16" fill="url(#blueBrush4)" opacity="0.9" transform="rotate(-2 195 130)"/>
    <rect x="50" y="170" width="290" height="250" rx="16" fill="#85A5FF" opacity="0.85" transform="rotate(2 195 295)"/>
    <rect x="120" y="100" width="160" height="110" rx="8" fill="#FFFFFF" opacity="0.92"/>
    <rect x="160" y="270" width="160" height="160" rx="12" fill="#ADC6FF" opacity="0.8"/>
  </g>
</svg>