<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2F1F8"/>
      <stop offset="100%" stop-color="#B2E0F0"/>
    </linearGradient>
    <linearGradient id="orangeBrush1" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="60%" stop-color="#FA541C"/>
      <stop offset="100%" stop-color="#D4380D"/>
    </linearGradient>
    <linearGradient id="cyanBrush1" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#13C2C2"/>
      <stop offset="50%" stop-color="#006D75"/>
      <stop offset="100%" stop-color="#003A40"/>
    </linearGradient>
    <linearGradient id="creamBrush1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF7E6"/>
      <stop offset="100%" stop-color="#FFE7BA"/>
    </linearGradient>
    <filter id="canvasTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect width="400" height="500" fill="url(#bg1)"/>
  <g filter="url(#canvasTexture)">
    <!-- Palette knife blocks -->
    <rect x="60" y="40" width="220" height="110" rx="12" fill="url(#orangeBrush1)" opacity="0.95" transform="rotate(-3 170 95)"/>
    <rect x="180" y="70" width="160" height="90" rx="8" fill="#FFC069" opacity="0.85" transform="rotate(2 260 115)"/>
    <rect x="40" y="130" width="320" height="30" rx="4" fill="#002329" opacity="0.9"/>
    <rect x="50" y="150" width="280" height="260" rx="16" fill="url(#cyanBrush1)" opacity="0.92"/>
    <rect x="190" y="180" width="120" height="180" rx="10" fill="#36CFC9" opacity="0.75" transform="rotate(1 250 270)"/>
    <rect x="80" y="240" width="110" height="140" rx="6" fill="#87E8DE" opacity="0.6"/>
    <rect x="130" y="320" width="180" height="120" rx="14" fill="url(#creamBrush1)" opacity="0.95" transform="rotate(-2 220 380)"/>
    <!-- Knife scrapes / white highlights -->
    <path d="M70 170 L310 175 L290 190 L60 185 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M120 220 L150 380 L135 385 L105 225 Z" fill="#FFFFFF" opacity="0.85"/>
    <path d="M220 120 L320 280 L300 290 L200 130 Z" fill="#FFA39E" opacity="0.5"/>
  </g>
</svg>